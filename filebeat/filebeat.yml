filebeat.inputs:
- type: filestream
  id: auth-logs
  enabled: true
  paths:
    - /var/log/app/auth_audit_v3.log
  parsers:
    - ndjson:
        target: "json"
        add_error_key: true

processors:
  - timestamp:
      field: "json.@timestamp"
      layouts:
        - '2006-01-02T15:04:05.999999Z'
      ignore_missing: false
      ignore_failure: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "auditoria-auth-%{+yyyy.MM.dd}"

setup.template.name: "auditoria-auth"
setup.template.pattern: "auditoria-auth-*"
setup.ilm.enabled: false