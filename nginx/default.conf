log_format elk_json escape=json '{"timestamp":"$time_iso8601","event":{"dataset":"nginx.access","kind":"event"},"service":{"type":"nginx"},"client":{"ip":"$remote_addr"},"http":{"request":{"method":"$request_method","referrer":"$http_referer","bytes":$request_length},"response":{"status_code":$status,"body":{"bytes":$body_bytes_sent}}},"url":{"original":"$request_uri"},"user_agent":{"original":"$http_user_agent"},"nginx":{"request_time":$request_time}}';

upstream flask_backend {
    server app:5000;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/stackelk/access.log elk_json;
    error_log  /var/log/stackelk/error.log error;

    # Endpoint local usado pelo healthcheck do container Nginx.
    location = /healthz {
        access_log /var/log/stackelk/access.log elk_json;
        default_type text/plain;
        return 200 "nginx-ok\n";
    }

    # Arquivos estáticos são servidos pelo próprio Nginx.
    # A tentativa de abrir um arquivo inexistente produz HTTP 404 e uma
    # entrada no error.log, além do registro correspondente no access.log.
    location ^~ /arquivos/ {
        root /usr/share/nginx/html;
    }

    # Demais requisições são encaminhadas para a aplicação Flask.
    location / {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
